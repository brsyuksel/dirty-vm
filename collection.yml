name: "dirty-vm"
help: "Manages virtual machines created for dirty jobs"
readme: "README.md"
environments:
  DIRTY_VM_HOME: "~/.dirty-vm"
  BRIDGE_IF_NAME: "dirtyvmbr0"
  DNS_UPSTREAM: "1.1.1.1"
runnables:
  - setup
  - check
  - images
  - pull
  - delete-image
  - create
  - list
  - start
  - stop
  - delete
  - run
  - ssh
  - forward
